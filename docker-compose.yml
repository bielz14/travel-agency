services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-app
    working_dir: /var/www/html
    env_file: .env.docker
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - build_data:/var/www/html/public/build
    networks:
      - travel-network
    depends_on:
      - db
    ports:
      - "5173:5173"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9000 || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 60s

  db:
    image: mysql:8.0
    container_name: travel-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: travel
      MYSQL_USER: traveluser
      MYSQL_PASSWORD: travelpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - travel-network

  web:
    image: nginx:alpine
    container_name: travel-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - build_data:/var/www/html/public/build
    depends_on:
      app:
        condition: service_healthy
    networks:
      - travel-network

volumes:
  db_data:
  vendor_data:
  build_data:

networks:
  travel-network:
    driver: bridge
